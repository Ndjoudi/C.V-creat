<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Test ATS — Supply Copilot</title>
<!--
  PAGE DE TEST ATS — ne fait pas partie de l'app.
  Elle affiche le CV d'un profil fictif avec le VRAI code du site
  (js/app.js, js/cv.js, js/lettre-reco.js) et la VRAIE mise en page
  d'impression, pour vérifier ce qu'un ATS lit dans le PDF.
  Mode d'emploi : voir README, section « Tester le CV avant de livrer ».
-->
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/cv.css">
<script>
  // Profil fictif mais complet : couvre tous les blocs du CV
  localStorage.setItem('sc_profile', JSON.stringify({
    firstName: 'Djoudi', lastName: 'NEHLIL',
    email: 'djoudi.test@gmail.com', phone: '07 61 00 48 56', location: 'Créteil (94)',
    linkedin: 'linkedin.com/in/djoudi-nehlil', title: 'Responsable Logistique', yearsExp: '7',
    mobility: 'Île-de-France', permis: 'Permis B', disponibilite: 'Immédiate', contratRecherche: 'CDI',
    accrocheIntro: 'Fort de 7 ans en logistique e-commerce et entrepôt',
    photo: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==',
    subdomains: ['Logistique / Entrepôt', 'Transport'], tools: ['WMS', 'SAP MM', 'Excel avancé'],
    certifs: ['CACES 1-3-5'], sectors: ['E-commerce', 'Retail / Distribution'],
    customSkills: ["Management d'équipe", 'Gestion des stocks'], informatique: ['Power BI'],
    experiences: [
      { title: 'Responsable de zone SEC', company: 'La Belle Vie (Deleev)', sector: 'E-commerce',
        location: 'Ivry-sur-Seine', duration: 'Sept 2018 – Sept 2021', contractType: 'CDI',
        reportingTo: 'Directeur des Opérations', description: '', bullets: [
          { text: "Pilotage d'une surface de 5 000 m² et d'une équipe de 12 préparateurs", required: true },
          { text: "Réduction des écarts d'inventaire de 25 % grâce à de nouveaux processus", selected: true },
          { text: "Déploiement d'outils de suivi de performance sous Excel et Power BI", selected: true } ] },
      { title: 'Préparateur de commandes', company: 'La Belle Vie (Deleev)', sector: 'E-commerce',
        location: 'Ivry-sur-Seine', duration: 'Sept 2016 – Août 2018', contractType: 'Alternance',
        description: '', bullets: [
          { text: "Préparation de 300 commandes par jour avec un taux d'erreur inférieur à 1 %", required: true } ] }
    ],
    education: [ { degree: 'Master Supply Chain Management', school: 'IAE Paris-Est', year: '2019 - 2021', mention: 'Mention Bien' } ],
    languages: [ { name: 'Français', level: 'Natif' }, { name: 'Anglais', level: 'Courant (B2)' } ],
    hobbies: 'Football, voyages', emphases: [],
    // Lettre de recommandation : vérifie qu'elle part en texte visible
    lettreRecoActive: true,
    lettreReco: { nom: 'lettre-test.pdf', pages: 1, ajouteeLe: '2026-09-14T00:00:00Z',
      texte: "Lettre de Recommandation\n\nEn tant que Directeur des Opérations Logistiques chez La Belle Vie, je recommande vivement Djoudi.\n\nAdrien Duval, Directeur des Opérations Logistiques" }
  }));
  localStorage.setItem('sc_cv_target', 'Responsable Logistique');
</script>
</head>
<body>
  <!-- Éléments minimaux attendus par renderCV() -->
  <div id="toast-wrap"></div>
  <div id="cv-empty" class="hidden"></div>
  <div id="cv-content"><input id="cv-target-input"><div id="cv-doc" class="cv-doc"></div></div>

  <script src="../js/app.js"></script>
  <script src="../js/cv.js"></script>
  <script src="../js/lettre-reco.js"></script>
  <script>
    // L'app complète n'est pas là : on neutralise son démarrage
    window.onload = null;
    window.print  = function () {};
    renderCV();
    printCV();   // construit #cv-print-wrapper exactement comme le bouton PDF
    document.title = 'Test ATS — Supply Copilot';
  </script>
</body>
</html>
